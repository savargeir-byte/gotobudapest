name: Validate Budapest sacred architecture additions
on:
  push:
    branches:
      - feat/budapest-landmark-churches
  pull_request:
    paths:
      - "lib/additional-attractions.ts"
      - "lib/sacred-attraction-editorial.ts"
      - "lib/attractions.ts"
      - "lib/attraction-editorial.ts"
      - "app/attractions/**"
      - "components/attraction-browser.tsx"
      - "e2e/sacred-attractions.spec.ts"
      - ".github/workflows/sacred-attractions.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/sacred-attractions.spec.ts

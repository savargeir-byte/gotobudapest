name: Verify GoToBudapest
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Validate inline photo placements and licences
        run: node scripts/validate-inline-photos.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (Portable Text safety, mappers, rate limiter)
        run: npm run test:unit
      - name: Dependency audit gate
        run: npm run audit:gate
      - name: Build Next.js
        run: npm run build
        env:
          SANITY_SEED_ON_BUILD: "0"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and mobile)
        run: npm run test:e2e

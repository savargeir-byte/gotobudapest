name: Verify GoToBudapest
on:
  push:
    branches:
      - main
      - feat/budapest-districts-experiences-guides
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate attractions
        run: npm run validate:content
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
